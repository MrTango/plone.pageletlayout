%define INSTANCEHOME var/instance
instancehome $INSTANCEHOME

%define CLIENTHOME var/instance
clienthome $CLIENTHOME

debug-mode off
security-policy-implementation C
verbose-security off

default-zpublisher-encoding utf-8

# Compile .po -> .mo on startup so add-on translations load without a build step.
<environment>
    zope_i18n_compile_mo_files true
</environment>
<zodb_db main>
    <filestorage>
        path $CLIENTHOME/var/Data.fs
        blob-dir $CLIENTHOME/var/blobs
    </filestorage>
    mount-point /
</zodb_db>
